services:
  postgres:
    image: postgres:16
    container_name: corporate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: corporate_reporting
      POSTGRES_USER: report_user
      POSTGRES_PASSWORD: report_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_user -d corporate_reporting"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: corporate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "10000:10000"
    environment:
      APP_ENV: production
      DB_TYPE: postgresql
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: corporate_reporting
      POSTGRES_USER: report_user
      POSTGRES_PASSWORD: report_password
    command: ["sh", "-c", "alembic upgrade head && uvicorn api.app:app --host 0.0.0.0 --port 10000"]

volumes:
  postgres_data:
