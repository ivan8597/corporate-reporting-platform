<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corporate Reporting Platform</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f7f9fc; color: #182230; }
    .card { padding: 24px; border-radius: 12px; background: white; max-width: 560px; box-shadow: 0 2px 12px #00000012; }
    button { padding: 12px 16px; background: #1976d2; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
    .kpi strong { display: block; font-size: 1.2rem; }
    a { color: #1976d2; }
  </style>
</head>
<body>
  <h1>Корпоративная платформа отчётности</h1>
  <div class="card">
    <form action="/generate/view" method="post">
      <button type="submit">Сгенерировать отчёт</button>
    </form>
    <h2>KPI</h2>
    <div class="kpi">
      <div>Выручка<strong>{{ revenue }} ₽</strong></div>
      <div>Маржа<strong>{{ margin }} %</strong></div>
      <div>MoM рост<strong>{{ mom }}</strong></div>
      <div>Заказы<strong>{{ orders }}</strong></div>
      <div>Аномалии<strong>{{ anomalies }}</strong></div>
    </div>
    <p><a href="/download">Скачать последний Excel-отчёт</a></p>
    <p><a href="/anomalies">Открыть JSON аномалий</a></p>
  </div>
</body>
</html>
